plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaomiera'
    compileSdk 34

    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.vaomiera"
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Génération et lecture des QR codes (Java pur, compatible minSdk 21)
    implementation 'com.google.zxing:core:3.3.0'
}
